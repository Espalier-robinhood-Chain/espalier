[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

[lint]
# Staleness dan grace period memang membandingkan block.timestamp dengan waktu feed (jendela detik-jam, bukan menit-presisi).
exclude_lints = ["block-timestamp"]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = false

# Profil CI: lebih berat dan deterministik.
[profile.ci]
fuzz = { runs = 2000, seed = "0x4553" }
invariant = { runs = 512, depth = 128 }
verbosity = 3

# Alamat dan RPC diisi lewat env (lihat .env.example), bukan di file ini.
[rpc_endpoints]
robinhood_testnet = "${RH_RPC_TESTNET}"
robinhood_mainnet = "${RH_RPC_MAINNET}"
